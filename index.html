<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-Item HTML Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .calculator { max-width: 400px; padding: 20px; border: 1px solid #ccc; borderRadius: 8px; }
        .item { display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Item Calculator</h2>
        <!-- 40 items -->
        <script>
            for(let i=1; i<=40; i++) {
                document.write(`<div class="item"><span>Item ${i}</span><input type="number" value="${i}" min="0"/></div>`);
            }
        </script>
    </div>
</body>
</html>
